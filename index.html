<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Signal Trading</title>
<style>
  :root { color-scheme: dark; --bg:#131722; --panel:#1e222d; --panel2:#171b26; --line:#2a2e39; --text:#d1d4dc; --muted:#787b86; --accent:#2962ff; --buy:#26a69a; --sell:#ef5350; --none:#f0b90b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; cursor: pointer; }

  /* Top bar */
  .top { height: 52px; display:flex; align-items:center; gap:16px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top:0; z-index: 20; }
  .brand { font-weight: 700; white-space: nowrap; display:flex; align-items:center; gap:8px; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background: linear-gradient(135deg, #7c5cff, #2962ff); }
  .searchbox { position: relative; flex: 0 1 340px; }
  .searchbox input { width:100%; background: var(--panel2); border:1px solid var(--line); color: var(--text); border-radius: 6px; padding: 7px 10px; outline: none; }
  .searchbox input:focus { border-color: var(--accent); }
  .dropdown { position:absolute; top: calc(100% + 4px); left:0; right:0; background: var(--panel); border:1px solid var(--line); border-radius: 6px; display:none; max-height: 320px; overflow:auto; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .dropdown.open { display:block; }
  .dd-item { display:grid; grid-template-columns: 90px 1fr auto; gap:8px; align-items:center; padding: 8px 10px; cursor:pointer; }
  .dd-item b { font-weight:600; }
  .dd-item span { color: var(--muted); overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-item em { font-style: normal; color: var(--muted); font-size: 11px; }
  .dd-item.active, .dd-item:hover { background: #2a2e39; }
  .styles { display:flex; gap:6px; flex-wrap: wrap; }
  .styles button { background: transparent; border:1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 6px 12px; }
  .styles button.active { background: rgba(41,98,255,.18); border-color: var(--accent); color: #fff; }

  /* Layout */
  .layout { display:grid; grid-template-columns: 240px 1fr; min-height: calc(100% - 52px); }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0 10px; overflow-y: auto; }
  .side h4 { margin: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .wl { display:flex; justify-content: space-between; align-items:center; padding: 7px 14px; cursor:pointer; }
  .wl:hover { background: #2a2e39; }
  .wl.sel { background: rgba(41,98,255,.18); }
  .wl .name { font-weight:600; }
  .wl .sub { font-size: 11px; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .BUY { background: rgba(38,166,154,.18); color: var(--buy); }
  .SELL { background: rgba(239,83,80,.18); color: var(--sell); }
  .NO_TRADE { background: rgba(240,185,11,.15); color: var(--none); }
  .ERR { background: rgba(239,83,80,.18); color: var(--sell); }
  .main { padding: 12px; display:flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card-head { display:flex; justify-content: space-between; align-items:center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .title { font-weight: 700; font-size: 16px; }
  .muted { color: var(--muted); font-size: 12px; }
  .levels { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .levels div { background: var(--panel2); border-radius: 6px; padding: 8px; }
